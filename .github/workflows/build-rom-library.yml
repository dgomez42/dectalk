name: Build ROM Library

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build-rom-library:
    name: "${{ matrix.rom_label }}"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - rom_label: "ROM_DTC03_Jan89"
            rom_define: "VOICE_ROM_DTC_03_03JAN89"
            vdf_define: "VDF_DTC_03_03JAN89"
          - rom_label: "ROM_DECtalk41"
            rom_define: "VOICE_ROM_DECTALK_41"
            vdf_define: "VDF_DECTALK_41"
          - rom_label: "ROM_DECtalk43"
            rom_define: "VOICE_ROM_DECTALK_43"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_1996male_43female"
            rom_define: "VOICE_ROM_DECTALK_1996M_43F"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_DTC03_female_both"
            rom_define: "VOICE_ROM_DTC03_FEM_BOTH"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_41_female_both"
            rom_define: "VOICE_ROM_41_FEM_BOTH"
            vdf_define: "VDF_DECTALK_41"
          - rom_label: "ROM_43_female_both"
            rom_define: "VOICE_ROM_43_FEM_BOTH"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_461_male_both"
            rom_define: "VOICE_ROM_461_MAL_BOTH"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_DTC03_male_both"
            rom_define: "VOICE_ROM_DTC03_MAL_BOTH"
            vdf_define: "VDF_DTC_03_03JAN89"
          - rom_label: "ROM_41_male_both"
            rom_define: "VOICE_ROM_41_MAL_BOTH"
            vdf_define: "VDF_DECTALK_41"
          - rom_label: "ROM_mixedrom1_5point0_R2R3"
            rom_define: "VOICE_ROM_MIXEDROM1"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_mixedrom2_DTU_male_440_female"
            rom_define: "VOICE_ROM_MIXEDROM2"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_464_oct2005"
            rom_define: "VOICE_ROM_464"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_DTU_USB"
            rom_define: "VOICE_ROM_DTU_USB"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_custom_GeneralAmerican"
            rom_define: "VOICE_ROM_CUSTOM_GA"
            vdf_define: "VDF_DECTALK_43"
          - rom_label: "ROM_current_499"
            rom_define: "VOICE_ROM_BETA5"
            vdf_define: "VDF_BETA5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Inject ROM and VDF defines
        shell: python
        run: |
          import re
          vcxproj_path = r'src\dapi\src\DECtalk API.vcxproj'
          rom_define = '${{ matrix.rom_define }}'
          vdf_define = '${{ matrix.vdf_define }}'
          with open(vcxproj_path, 'r', encoding='utf-8') as f:
              content = f.read()
          def add_defines(match):
              existing = match.group(1)
              cleaned = re.sub(r';?VOICE_ROM_\w+', '', existing)
              cleaned = re.sub(r';?VDF_\w+', '', cleaned)
              return f'<PreprocessorDefinitions>{cleaned};{rom_define};{vdf_define}</PreprocessorDefinitions>'
          content = re.sub(r'<PreprocessorDefinitions>(.*?)</PreprocessorDefinitions>',
                           add_defines, content)
          with open(vcxproj_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Injected {rom_define} and {vdf_define}')

      - name: Build DECtalk (IA32 and AMD64)
        shell: cmd
        run: devops\vs2022\dt_buildall.bat

      - name: Copy files to dist folder
        shell: cmd
        run: devops\vs2022\dt_copyfiles.bat

      - name: Rename DLLs with ROM label
        shell: python
        run: |
          import os, shutil, glob
          label = '${{ matrix.rom_label }}'
          dist = 'dist'
          for dll in glob.glob(os.path.join(dist, '**', 'dectalk.dll'), recursive=True):
              folder = os.path.dirname(dll)
              arch = 'ia32' if 'ia32' in folder.lower() or 'win32' in folder.lower() else 'amd64'
              new_name = os.path.join(dist, f'dectalk_{label}_{arch}.dll')
              shutil.copy2(dll, new_name)
              print(f'Copied {dll} -> {new_name}')

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.rom_label }}"
          path: "dist/dectalk_${{ matrix.rom_label }}_*.dll"
          if-no-files-found: error
